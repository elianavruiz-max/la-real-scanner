<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Lector La Real</title>
  <style>
    :root { --olive:#556B2F; --cream:#F7F3EA; --dark:#222; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; min-height:100%; background:#111; font-family:Arial,Helvetica,sans-serif; }
    body { color:#fff; }
    #scanner { position:fixed; inset:0; overflow:hidden; background:#111; }
    #scanner video { width:100% !important; height:100% !important; object-fit:cover !important; }
    #scanner canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }
    .shade { position:fixed; inset:0; pointer-events:none; }
    .guide {
      position:absolute;
      left:6%; right:6%; top:36%; height:28%;
      border:3px solid rgba(255,255,255,.95);
      border-radius:18px;
      box-shadow:0 0 0 9999px rgba(0,0,0,.40);
    }
    .line { position:absolute; left:5%; right:5%; top:50%; height:2px; background:rgba(255,255,255,.9); }
    .top {
      position:fixed; top:0; left:0; right:0;
      padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
      text-align:center;
      background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0));
      z-index:10;
    }
    .top b { font-size:20px; }
    .bottom {
      position:fixed; bottom:0; left:0; right:0;
      z-index:10;
      padding:18px 16px calc(18px + env(safe-area-inset-bottom));
      background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.88));
      text-align:center;
    }
    #status { min-height:24px; font-size:16px; font-weight:bold; margin-bottom:10px; }
    button {
      width:100%; max-width:460px; border:0; border-radius:14px;
      padding:15px; font-size:17px; font-weight:bold; margin:5px auto;
    }
    .primary { background:var(--olive); color:#fff; }
    .secondary { background:#fff; color:#222; }
    .hidden { display:none !important; }
    #resultBox {
      position:fixed; inset:0; z-index:30; background:var(--cream); color:var(--dark);
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      padding:24px; text-align:center;
    }
    #resultCode { font-size:32px; font-weight:bold; word-break:break-all; margin:16px 0; }
  </style>
</head>
<body>
  <div id="scanner"></div>

  <div class="shade">
    <div class="guide"><div class="line"></div></div>
  </div>

  <div class="top">
    <b>La Real · Lector</b><br>
    <small>Ubicá el código dentro del recuadro</small>
  </div>

  <div class="bottom">
    <div id="status">Iniciando cámara…</div>
    <button id="retryBtn" class="primary hidden" onclick="startScanner()">ACTIVAR CÁMARA</button>
    <button class="secondary" onclick="closeReader()">CANCELAR</button>
  </div>

  <div id="resultBox" class="hidden">
    <div>Código detectado</div>
    <div id="resultCode"></div>
    <div id="resultMsg">Enviando al inventario…</div>
    <button id="copyBtn" class="primary hidden" onclick="copyCode()">COPIAR CÓDIGO</button>
    <button id="backBtn" class="secondary hidden" onclick="closeReader()">VOLVER AL INVENTARIO</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
  <script>
    let running = false;
    let locked = false;
    let acceptedCode = '';
    let candidateCode = '';
    let candidateCount = 0;
    let candidateAt = 0;

    function setStatus(text) {
      document.getElementById('status').textContent = text;
    }

    function scannerConfig() {
      return {
        inputStream: {
          name: 'Live',
          type: 'LiveStream',
          target: document.querySelector('#scanner'),
          constraints: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 },
            aspectRatio: { ideal: 1.7777778 }
          },
          area: {
            top: '30%',
            right: '5%',
            left: '5%',
            bottom: '30%'
          }
        },
        locator: {
          patchSize: 'medium',
          halfSample: true
        },
        numOfWorkers: Math.max(1, Math.min(4, navigator.hardwareConcurrency || 2)),
        frequency: 12,
        decoder: {
          readers: [
            'ean_reader',
            'ean_8_reader',
            'upc_reader',
            'upc_e_reader',
            'code_128_reader'
          ],
          multiple: false
        },
        locate: true
      };
    }

    async function startScanner() {
      if (running || locked) return;

      document.getElementById('retryBtn').classList.add('hidden');
      setStatus('Solicitando cámara trasera…');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Este navegador no permite acceso a la cámara.');
        document.getElementById('retryBtn').classList.remove('hidden');
        return;
      }

      try {
        await new Promise((resolve, reject) => {
          Quagga.init(scannerConfig(), err => err ? reject(err) : resolve());
        });

        Quagga.onDetected(onDetected);
        Quagga.start();
        running = true;
        setStatus('Apuntá al código de barras');

        // Mejora de foco/zoom cuando el navegador y la cámara lo permiten.
        setTimeout(async () => {
          try {
            const track = Quagga.CameraAccess.getActiveTrack();
            if (!track || !track.getCapabilities) return;
            const caps = track.getCapabilities();
            const advanced = {};

            if (Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
              advanced.focusMode = 'continuous';
            }
            if (caps.zoom && typeof caps.zoom.min === 'number' && typeof caps.zoom.max === 'number') {
              advanced.zoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1.4));
            }

            if (Object.keys(advanced).length) {
              await track.applyConstraints({ advanced:[advanced] });
            }
          } catch (e) {
            // No todos los iPhone/Android exponen estas capacidades. No es un error fatal.
          }
        }, 500);
      } catch (err) {
        console.error(err);
        running = false;
        setStatus(cameraErrorMessage(err));
        document.getElementById('retryBtn').classList.remove('hidden');
      }
    }

    function onDetected(result) {
      if (locked || !result || !result.codeResult) return;

      const code = String(result.codeResult.code || '').trim();
      if (!code || code.length < 3) return;

      // Exige dos lecturas iguales cercanas para reducir falsos positivos.
      const now = Date.now();
      if (code === candidateCode && now - candidateAt < 1800) {
        candidateCount++;
      } else {
        candidateCode = code;
        candidateCount = 1;
      }
      candidateAt = now;

      if (candidateCount < 2) {
        setStatus('Confirmando ' + code + '…');
        return;
      }

      acceptCode(code);
    }

    async function acceptCode(code) {
      if (locked) return;

      locked = true;
      acceptedCode = code;

      try {
        if (navigator.vibrate) navigator.vibrate(120);
      } catch (e) {}

      stopScanner();

      document.getElementById('resultCode').textContent = code;
      document.getElementById('resultBox').classList.remove('hidden');

      /*
       * Camino 1: si el navegador conserva window.opener,
       * enviamos el código a la pantalla de inventario y cerramos.
       */
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({
            source:'la-real-scanner',
            type:'barcode',
            code:code
          }, '*');

          document.getElementById('resultMsg').textContent =
            'Código enviado. Volviendo al inventario…';

          setTimeout(() => {
            try { window.close(); } catch (e) {}

            setTimeout(() => {
              try {
                if (!window.closed) {
                  document.getElementById('backBtn').classList.remove('hidden');
                }
              } catch (e) {
                document.getElementById('backBtn').classList.remove('hidden');
              }
            }, 350);
          }, 250);

          return;

        } catch (e) {
          console.error(e);
        }
      }

      /*
       * Camino 2 (iPhone/Safari y algunos Android):
       * Apps Script puede abrir GitHub sin window.opener.
       * En ese caso volvemos automáticamente a la URL PÚBLICA
       * script.google.com/macros/s/.../exec.
       */
      const params = new URLSearchParams(location.search);
      const returnUrl = String(params.get('returnUrl') || '');
      const inventoryId = String(params.get('inventoryId') || '');
      const scanToken = String(params.get('scanToken') || '');

      if (returnUrl) {
        try {
          const u = new URL(returnUrl);

          /*
           * Seguridad/estabilidad: solo aceptamos la URL pública
           * oficial de la Web App de Google Apps Script.
           */
          if (
            u.protocol === 'https:' &&
            u.hostname === 'script.google.com' &&
            u.pathname.indexOf('/macros/s/') !== -1
          ) {
            u.searchParams.set('code', code);

            if (inventoryId) {
              u.searchParams.set('inventoryId', inventoryId);
            }

            if (scanToken) {
              u.searchParams.set('scanToken', scanToken);
            }

            document.getElementById('resultMsg').textContent =
              'Código leído. Abriendo el artículo…';

            /*
             * replace evita que al tocar "atrás" Safari vuelva
             * a la pantalla del código ya leído.
             */
            setTimeout(() => {
              location.replace(u.toString());
            }, 120);

            return;
          }

        } catch (e) {
          console.error(e);
        }
      }

      document.getElementById('resultMsg').textContent =
        'Código leído. Tocá VOLVER AL INVENTARIO.';
      document.getElementById('copyBtn').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
    }

    function stopScanner() {
      if (!running) return;
      try { Quagga.offDetected(onDetected); } catch (e) {}
      try { Quagga.stop(); } catch (e) {}
      running = false;
    }

    function closeReader() {
      stopScanner();

      try {
        if (window.opener && !window.opener.closed) {
          window.close();
          return;
        }
      } catch (e) {}

      const params = new URLSearchParams(location.search);
      const returnUrl = String(params.get('returnUrl') || '');

      if (returnUrl) {
        try {
          const u = new URL(returnUrl);

          if (
            u.protocol === 'https:' &&
            u.hostname === 'script.google.com' &&
            u.pathname.indexOf('/macros/s/') !== -1
          ) {
            location.replace(u.toString());
            return;
          }
        } catch (e) {}
      }

      history.back();
    }

    async function copyCode() {
      if (!acceptedCode) return;
      try {
        await navigator.clipboard.writeText(acceptedCode);
        document.getElementById('resultMsg').textContent = 'Código copiado. Volvé al inventario.';
      } catch (e) {
        document.getElementById('resultMsg').textContent = 'Código: ' + acceptedCode;
      }
    }

    function cameraErrorMessage(err) {
      const name = String(err && err.name || '');
      if (/NotAllowed|PermissionDenied/i.test(name)) {
        return 'Permiso de cámara denegado. Habilitá Cámara para este sitio y reintentá.';
      }
      if (/NotFound|DevicesNotFound/i.test(name)) {
        return 'No encontré una cámara disponible.';
      }
      if (/NotReadable|TrackStart/i.test(name)) {
        return 'La cámara está siendo usada por otra aplicación. Cerrala y reintentá.';
      }
      return 'No pude iniciar la cámara. Tocá ACTIVAR CÁMARA para reintentar.';
    }

    window.addEventListener('pagehide', stopScanner);
    window.addEventListener('beforeunload', stopScanner);
    window.addEventListener('load', () => {
      // Intenta iniciar automáticamente. Si Safari exige interacción, aparecerá el botón.
      startScanner();
    });
  </script>
</body>
</html>
